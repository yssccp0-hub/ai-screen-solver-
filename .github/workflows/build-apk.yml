name: Build Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ai_screen_solver_flutter.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Siapkan Project Flutter Standar
        run: |
          flutter create --platforms=android --org com.ai --project-name screensolver fresh_app
          rm -rf fresh_app/lib fresh_app/test
          cp -r ai_screen_solver_flutter/lib fresh_app/
          cp -r ai_screen_solver_flutter/assets fresh_app/
          cp ai_screen_solver_flutter/android/app/src/main/AndroidManifest.xml fresh_app/android/app/src/main/AndroidManifest.xml
          mkdir -p fresh_app/android/app/src/main/kotlin/com/ai/screensolver
          cp ai_screen_solver_flutter/android/app/src/main/kotlin/com/ai/screensolver/*.kt fresh_app/android/app/src/main/kotlin/com/ai/screensolver/
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' fresh_app/android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' fresh_app/android/app/build.gradle 2>/dev/null || true
          cat << 'EOF' > fresh_app/pubspec.yaml
          name: ai_screen_solver
          description: Floating AI Screen Scanner & Auto Solver overlay.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_overlay_window: ^0.5.0
            webview_flutter: ^4.10.0

          flutter:
            uses-material-design: true
            assets:
              - assets/html/ai-assistive-scanner.html
          EOF
      - name: Build APK Release
        run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Screen-Solver-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
          
